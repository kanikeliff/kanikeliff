name: Update streak dragon
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dragon.yml'
      - 'dragon/**'
permissions:
  contents: write
concurrency:
  group: dragon-default-branch
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Select stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dragon/update.py
      - name: Update mascot when its stage changes
        run: |
          git add -- assets/dragon.gif README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update dragon growth stage'
            git push
          fi
